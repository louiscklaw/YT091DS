    <script>
      document
        .getElementById("shareBtn")
        .addEventListener("click", function () {
          const url = window.location.href;

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard
              .writeText(url)
              .then(function () {
                alert("條 link 而家係剪貼簿，可以分享比朋友啦 🙌");
              })
              .catch(function (err) {
                fallbackCopyText(url);
              });
          } else {
            fallbackCopyText(url);
          }

          function fallbackCopyText(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed"; // Avoid scrolling to bottom
            textarea.style.top = "0";
            textarea.style.left = "0";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
              const successful = document.execCommand("copy");
              if (successful) {
                alert("條 link 而家係剪貼簿，可以分享比朋友啦 🙌");
              } else {
                alert("Failed to copy link");
              }
            } catch (err) {
              alert("Failed to copy link");
            }
            document.body.removeChild(textarea);
          }
        });
    </script>

    <script>
      // sets up a message channel with es-dev-server to receive events
      // for reloading the browser on file change or logging errors
      (function () {
        if (!("EventSource" in window)) {
          return;
        }

        var eventSource = new EventSource("/__es-dev-server__/message-channel");
        var reloading = false;

        eventSource.addEventListener("file-changed", function (e) {
          reloading = true;
          location.reload();
        });

        eventSource.addEventListener("error-message", function (e) {
          if (reloading) {
            return;
          }

          console.error(JSON.parse(e.data));
        });

        eventSource.addEventListener("error", function () {
          if (reloading) {
            return;
          }

          console.log(
            "Disconnected from es-dev-server, no longer reloading on file changes.",
          );
          eventSource.close();
        });
      })();
    </script>

    <script>
      if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            .then((reg) => console.log("Service Worker registered!", reg.scope))
            .catch((err) => console.error("Registration failed:", err));
