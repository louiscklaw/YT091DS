<!doctype html>
<html lang="zh-HK" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <link rel="manifest" href="/manifest.json" />

    <title>得閒温下書</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style data-purpose="custom-fonts">
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700&display=swap");
      body {
        font-family: "Noto Sans HK", sans-serif;
        background-color: #ffffff;
        /* Subtle noise texture as seen in the original image */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      }
    </style>
    <style data-purpose="custom-shadows">
      .btn-shadow {
        box-shadow:
          0 10px 20px -5px rgba(0, 0, 0, 0.2),
          0 4px 6px -2px rgba(0, 0, 0, 0.1);
      }
      .text-shadow {
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700&amp;display=swap"
      data-snapdom="injected-import"
    />
  </head>
  <body class="min-h-screen flex flex-col pt-16 px-6 pb-8 max-w-md mx-auto">
    <!-- BEGIN: HeaderSection -->
    <header class="mb-8 pl-2">
      <h1 class="text-4xl font-bold leading-snug tracking-wide text-gray-900">
        你好！<br />
        準備好學習了嗎？
      </h1>
    </header>
    <!-- END: HeaderSection -->
    <!-- BEGIN: MainContent -->
    <main class="flex-1 flex flex-col gap-5">
      <!-- Course Button 1 -->
      <a
        class="group relative flex items-center justify-between px-6 rounded-2xl bg-gradient-to-r from-[#57a1f8] to-[#a865ff] btn-shadow transform transition-transform active:scale-95"
        href="./chapter_2_mc.html"
      >
        <span class="text-white text-2xl font-medium tracking-wide text-shadow"
          >01 - 單元 2 MC</span
        >
        <!-- Open Book Icon Placeholder -->
        <div
          class="w-20 h-20 rounded-xl flex items-center justify-center shrink-0 ml-4"
        >
          <span class="text-3xl">📖</span>
        </div>
      </a>
      <!-- Course Button 2 -->
      <a
        class="group relative flex items-center justify-between px-6 rounded-2xl bg-gradient-to-r from-[#57a1f8] to-[#a865ff] btn-shadow transform transition-transform active:scale-95"
        href="./chapter_3_mc.html"
      >
        <span class="text-white text-2xl font-medium tracking-wide text-shadow"
          ><span style="letter-spacing: 0.6px">02 - 單元 3 MC</span></span
        >
        <!-- Open Book Icon Placeholder -->
        <div
          class="w-20 h-20 rounded-xl flex items-center justify-center shrink-0 ml-4"
        >
          <span class="text-3xl">📖</span>
        </div>
      </a>
      <!-- Course Button 3 -->
      <a
        class="group relative flex items-center justify-between px-6 rounded-2xl bg-gradient-to-r from-[#1eb1a4] to-[#6cd7f0] btn-shadow transform transition-transform active:scale-95"
        href="./herbs_recognition.html"
      >
        <span class="text-white text-2xl font-medium tracking-wide text-shadow"
          >03 - 得閒認下藥</span
        >
        <!-- Mortar and Pestle Icon Placeholder -->
        <div
          class="w-20 h-20 rounded-xl flex items-center justify-center shrink-0 ml-4"
        >
          <span class="text-3xl">🌿</span>
        </div>
      </a>
      <!-- Divider Spacer -->
      <hr />
      <!-- Help Button -->
      <a
        class="group relative flex items-center justify-between px-6 rounded-2xl bg-gradient-to-r from-[#d63384] to-[#8228cf] btn-shadow transform transition-transform active:scale-95"
        href="https://forms.gle/pTBUZ9wyJ8RAphpGA"
      >
        <span class="text-white text-2xl font-medium tracking-wide text-shadow"
          >有咩問題？</span
        >
        <!-- Question Mark Icon Placeholder -->
        <div
          class="w-16 h-16 rounded-full flex items-center justify-center shrink-0 ml-4"
        >
          <span class="text-5xl text-purple-900/40 font-bold opacity-80"
            >?</span
          >
        </div>
      </a>
      <!-- Bottom Action Row -->
      <div class="flex gap-4 mt-2">
        <!-- Share Button -->
        <a
          class="flex-1 flex items-center justify-center gap-3 px-6 py-5 rounded-2xl bg-gradient-to-r from-[#293282] to-[#427FD9] btn-shadow transform transition-transform active:scale-95"
          href="#"
          id="shareBtn"
        >
          <span class="text-white text-xl font-medium tracking-wide text-shadow"
            >分享</span
          >
          <!-- Handshake Icon Placeholder -->
          <span class="text-3xl">🤝</span>
        </a>
        <!-- Source Code Button -->
        <a
          class="flex-1 flex items-center justify-center gap-3 px-6 py-5 rounded-2xl bg-gradient-to-r from-[#221B66] to-[#405BB3] btn-shadow transform transition-transform active:scale-95"
          href="https://github.com/louiscklaw/YT091DS"
        >
          <span class="text-white text-xl font-medium tracking-wide text-shadow"
            >原始碼</span
          >
          <!-- Wrench/Code Icon Placeholder -->
          <span class="text-3xl">🛠️</span>
        </a>
      </div>
    </main>
    <!-- END: MainContent -->

    <script>
      // Check if the browser supports service workers
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("Service Worker registered!", reg))
            .catch((err) => console.error("Registration failed:", err));
        });
      }
    </script>
  </body>
</html>
