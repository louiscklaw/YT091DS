<!doctype html>

<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Flashcard App</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style data-purpose="custom-styles">
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap");

      body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: #f7f9fc; /* Very light grey/blue background */
        /* Add a subtle gradient background similar to the image */
        background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Custom shadow for the main card to match the glow effect */
      .card-shadow {
        box-shadow:
          0 10px 30px -5px rgba(59, 130, 246, 0.2),
          0 4px 10px -3px rgba(59, 130, 246, 0.1);
      }

      /* Circular Navigation Buttons */
      .nav-btn {
        background: linear-gradient(
          135deg,
          #74abe2,
          #5563a6
        ); /* Blue gradient */
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        transition: transform 0.1s;
      }
      .nav-btn:active {
        transform: scale(0.95);
      }

      /* Square Action Buttons */
      .action-btn {
        background: linear-gradient(
          135deg,
          #fee140,
          #fa709a
        ); /* Yellow/orange gradient */
        box-shadow: 0 6px 15px -3px rgba(250, 112, 154, 0.4);
        transition: transform 0.1s;
      }
      .action-btn:active {
        transform: scale(0.95);
      }

      /* Bottom Home Button */
      .home-btn {
        background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
        box-shadow: 0 4px 14px 0 rgba(0, 118, 255, 0.39);
      }
    </style>

    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>

  <body
    class="antialiased text-gray-800 safe-area-pt"
    style="
      background: linear-gradient(180deg, #f0f4f8 0%, #e2e8f0 100%);
      min-height: 100vh;
    "
  >
    <!-- BEGIN: Main Container -->
    <main
      class="flex-1 flex flex-col items-center w-full max-w-md mx-auto px-4 py-8 relative"
    >
      <!-- BEGIN: Header Section -->
      <header class="text-center mb-8 mt-4 w-full" data-purpose="header">
        <h1 class="text-4xl font-bold text-gray-700 tracking-wide mb-0">
          主題: 單元 - 二
        </h1>
        <p class="text-lg text-gray-500 mt-1">卡片 1 / 217</p>
      </header>
      <!-- END: Header Section -->

      <!-- BEGIN: Flashcard Content -->
      <section
        class="w-full bg-white rounded-3xl p-6 mb-10 card-shadow relative overflow-hidden"
        data-purpose="flashcard-card"
        style="box-shadow: 0 15px 40px -10px rgba(59, 130, 246, 0.2)"
      >
        <div
          class="text-lg leading-relaxed space-y-4 font-medium text-gray-800"
        >
          <p class="mb-6 text-xl">
            1. 根據陰陽的變化規律，以下哪一項
            <span class="font-bold">不屬於</span> 陰陽的主要變化規律？
          </p>
          <div class="space-y-2 text-[1.1rem]">
            <p>A. 陰陽對立</p>
            <p>B. 陰陽依存</p>
            <p>C. 陰陽消長與轉化</p>
            <p>D. 陰陽永恆不變</p>
          </div>
        </div>
      </section>
      <!-- END: Flashcard Content -->
      <!-- BEGIN: Navigation Controls -->
      <nav
        class="w-full flex justify-between items-center mb-10 px-2"
        data-purpose="navigation-buttons"
      >
        <!-- Start Button -->
        <div class="flex flex-col items-center gap-1">
          <button
            class="nav-btn w-[3.25rem] h-[3.25rem] rounded-full flex items-center justify-center text-white bg-blue-400 hover:bg-blue-500 shadow-md"
          >
            <i class="fa-solid fa-angles-left text-xl"></i>
          </button>
          <span class="text-sm text-gray-500">回到開始</span>
        </div>
        <!-- Prev Button -->
        <div class="flex flex-col items-center gap-1">
          <button
            class="nav-btn w-[3.25rem] h-[3.25rem] rounded-full flex items-center justify-center text-white bg-blue-400 hover:bg-blue-500 shadow-md"
          >
            <i class="fa-solid fa-angle-left text-xl"></i>
          </button>
          <span class="text-sm text-gray-500">回上一條</span>
        </div>
        <!-- Reset Button -->
        <div class="flex flex-col items-center gap-1">
          <button
            class="nav-btn w-[3.25rem] h-[3.25rem] rounded-full flex items-center justify-center text-white bg-blue-400 hover:bg-blue-500 shadow-md"
          >
            <i class="fa-solid fa-rotate-right text-xl"></i>
          </button>
          <span class="text-sm text-gray-500">看答案</span>
        </div>
        <!-- Next Button -->
        <div class="flex flex-col items-center gap-1">
          <button
            class="nav-btn w-[3.25rem] h-[3.25rem] rounded-full flex items-center justify-center text-white bg-blue-400 hover:bg-blue-500 shadow-md"
          >
            <i class="fa-solid fa-angle-right text-xl"></i>
          </button>
          <span class="text-sm text-gray-500">到下一條</span>
        </div>
      </nav>
      <!-- END: Navigation Controls -->

      <!-- BEGIN: Action Controls -->
      <div
        class="flex justify-center gap-6 mb-12 w-full"
        data-purpose="action-buttons"
      >
        <!-- Shuffle Button -->
        <button
          class="action-btn w-28 h-28 rounded-2xl flex flex-col items-center justify-center bg-gradient-to-br from-yellow-300 to-yellow-500 text-gray-800"
          style="box-shadow: 0 10px 25px -5px rgba(250, 170, 50, 0.4)"
        >
          <i class="fa-solid fa-shuffle text-3xl mb-2 text-gray-700"></i>
          <span class="font-medium text-[20px]">兜亂</span>
        </button>
        <!-- Q&A Button -->
        <button
          class="action-btn w-28 h-28 rounded-2xl flex flex-col items-center justify-center bg-gradient-to-br from-yellow-300 to-yellow-500 text-gray-800"
          style="box-shadow: 0 10px 25px -5px rgba(250, 170, 50, 0.4)"
        >
          <div
            class="text-2xl font-bold mb-1 text-gray-700 flex items-center justify-center gap-1"
          >
            <span>问</span>
            <i class="fa-solid fa-arrows-left-right text-2xl"></i>
            <span>答</span>
          </div>
          <span class="font-medium text-[20px]">Q&amp;A</span>
        </button>
      </div>
      <!-- END: Action Controls -->

      <!-- BEGIN: Bottom Home Button -->
      <div class="w-full mt-auto pb-4" data-purpose="bottom-bar">
        <button
          class="home-btn w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-white font-bold text-xl bg-blue-500 hover:bg-blue-600 active:scale-[0.98] transition-transform"
          style="box-shadow: 0 10px 25px -5px rgba(0, 118, 255, 0.4)"
        >
          <!-- <i class="fa-regular fa-hand text-2xl"></i> -->
          <span>回到主頁</span>
        </button>
      </div>
      <!-- END: Bottom Home Button -->
    </main>
    <!-- END: Main Container -->
  </body>
</html>
