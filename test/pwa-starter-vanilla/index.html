  <body
    class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center"

    <div class="container text-center">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm p-4 bg-white rounded-4">
            <h1 class="h3 mb-4 fw-bold text-dark">得閒刨下書:</h1>

            <div class="d-grid gap-3">
              <a
                href="./chapter_2_mc.html"

                style="background-color: #686de0"
                >📖 001 - Chapter 2 MC</a
              >
              <a
                href="./chapter_3_mc.html"
                class="btn btn-primary btn-lg py-3 fw-semibold shadow-sm text-start"
                style="background-color: #686de0"
                >📖 002 - Chapter 3 MC</a

              <a
                href="./herbs_recognition.html"

              <hr />

              <a
                href="https://forms.gle/pTBUZ9wyJ8RAphpGA"

              <hr />

              <button
                type="button"
                id="shareBtn"
                class="btn btn-success btn-lg py-3 fw-semibold shadow-sm text-start"

              >
                🙌 share
              </button>

    </div>
    <!-- Bootstrap 5 JS Bundle CDN (optional for interactive components) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      document
        .getElementById("shareBtn")
        .addEventListener("click", function () {
          const url = window.location.href;

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard
              .writeText(url)
              .then(function () {
                alert("the link has been copied");
              })
              .catch(function (err) {
                fallbackCopyText(url);
              });
          } else {
            fallbackCopyText(url);
          }

          function fallbackCopyText(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed"; // Avoid scrolling to bottom
            textarea.style.top = "0";
            textarea.style.left = "0";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
              const successful = document.execCommand("copy");
              if (successful) {
                alert("the link has been copied");
              } else {
                alert("Failed to copy link");
              }
            } catch (err) {
              alert("Failed to copy link");
            }
            document.body.removeChild(textarea);
          }
        });
    </script>

    <script>
      // sets up a message channel with es-dev-server to receive events
      // for reloading the browser on file change or logging errors
      (function () {
        if (!("EventSource" in window)) {
          return;
        }

        var eventSource = new EventSource("/__es-dev-server__/message-channel");
        var reloading = false;

        eventSource.addEventListener("file-changed", function (e) {
          reloading = true;
          location.reload();
        });

        eventSource.addEventListener("error-message", function (e) {
          if (reloading) {
            return;
          }

          console.error(JSON.parse(e.data));
        });

        eventSource.addEventListener("error", function () {
          if (reloading) {
            return;
          }

          console.log(
            "Disconnected from es-dev-server, no longer reloading on file changes.",
          );
          eventSource.close();
        });
      })();
    </script>
  </body>
</html>
